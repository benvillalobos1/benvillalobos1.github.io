<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 32px;
      font-weight: 600;
    }

    .subtitle {
      margin-bottom: 35px;
      color: #666;
      font-size: 16px;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    input {
      width: 100%;
      padding: 20px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 20px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: #1677ff;
    }

    button {
      width: 100%;
      padding: 22px;
      border: none;
      border-radius: 10px;
      background: #1677ff;
      color: white;
      font-size: 21px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: #0d63d8;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>Create Your Profile</h1>
    <p class="subtitle">Enter your name to get started</p>

    <form class="form">
      <input
        type="text"
        name="name"
        placeholder="Your name"
        autocomplete="name"
        required
      >

      <button type="submit">
        Create Profile
      </button>
    </form>
  </main>

</body>
</html>
