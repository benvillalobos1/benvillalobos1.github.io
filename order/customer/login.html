<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Profile</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 32px;
      font-weight: 600;
    }

    .subtitle {
      margin-bottom: 35px;
      color: #666;
      font-size: 16px;
    }

    .profiles {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .profile-button,
    .new-profile-button {
      width: 100%;
      padding: 22px;
      border-radius: 10px;
      font-size: 21px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .profile-button {
      border: none;
      background: #1677ff;
      color: white;
    }

    .profile-button:hover {
      background: #0d63d8;
      transform: translateY(-2px);
    }

    .new-profile-button {
      margin-top: 10px;
      border: 2px solid #1677ff;
      background: white;
      color: #1677ff;
    }

    .new-profile-button:hover {
      background: #f2f7ff;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Select Your Profile</h1>
    <p class="subtitle">Choose your name to start ordering</p>

    <div class="profiles">
      <button class="profile-button" type="button">
        Alex
      </button>

      <button class="profile-button" type="button">
        Jordan
      </button>

      <button class="profile-button" type="button">
        Taylor
      </button>

      <button class="new-profile-button" type="button" onclick="goToCreateProfilePage()">
        + Create New Profile
      </button>
    </div>
  </main>

  <script>
    function goToCreateProfilePage() {
        window.location.href = "/order/customer/create.html"
    }
  </script>

</body>
</html>
