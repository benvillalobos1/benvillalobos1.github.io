<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 32px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    button {
      width: 100%;
      padding: 24px;
      border: none;
      border-radius: 10px;
      background: #1677ff;
      color: white;
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: #0d63d8;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Welcome</h1>

    <div class="buttons">
      <button type="button" onclick="goToCustomerPage()">Customer</button>
      <button type="button">Bartender</button>
    </div>
  </main>

  <script>
    function goToCustomerPage() {
      window.location.href = "/order/customer/login.html"
    }
  </script>
</body>
</html>
